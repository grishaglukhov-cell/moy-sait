name: IndexNow

on:
  push:
    branches: [greklama-direct]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Сообщить Яндексу об изменённых страницах
        run: python3 .github/indexnow.py "${{ github.event_name == 'workflow_dispatch' && '--all' || github.event.before }}"
